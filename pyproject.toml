[project]
name = "bms-idpa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lorin Steiner", email = "lorin.steiner@bluewin.ch" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
    "typer>=0.29.2",
]

[project.scripts]
pretest = "idpa.pretest:main"
test = "idpa.test:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "idpa"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
